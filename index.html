<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Budget</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f12;
    --surface: #1a1a20;
    --surface2: #22222a;
    --border: #2e2e3a;
    --accent: #c8f55a;
    --accent-dim: #9dc445;
    --red: #ff5c5c;
    --red-dim: #3a1a1a;
    --green: #c8f55a;
    --green-dim: #1e2a0f;
    --text: #f0f0f5;
    --text-mid: #9898a8;
    --text-faint: #55555f;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 16px;
  }

  html { height: 100%; background: var(--bg); }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ── App shell ── */
  #app { max-width: 430px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

  /* ── Header ── */
  header {
    padding: 20px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.08em; }
  .month-btn {
    font-family: var(--mono); font-size: 12px; color: var(--text-mid);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .month-btn:active { opacity: 0.7; }

  /* ── Big balance card ── */
  .hero {
    margin: 20px 20px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(200,245,90,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }
  .hero-label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; font-family: var(--mono); }
  .hero-amount {
    font-family: var(--mono); font-size: 42px; font-weight: 500;
    line-height: 1.1; margin: 6px 0 20px;
    transition: color 0.3s;
  }
  .hero-amount.positive { color: var(--accent); }
  .hero-amount.negative { color: var(--red); }

  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat {
    background: var(--surface2);
    border-radius: 12px; padding: 12px;
  }
  .stat-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--mono); }
  .stat-value { font-family: var(--mono); font-size: 18px; font-weight: 500; margin-top: 4px; }
  .stat-value.in { color: var(--accent); }
  .stat-value.out { color: var(--red); }

  /* ── Progress bar ── */
  .budget-bar {
    margin: 16px 20px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .bar-title { font-size: 11px; color: var(--text-mid); font-family: var(--mono); }
  .bar-pct { font-family: var(--mono); font-size: 12px; color: var(--text-mid); }
  .bar-track {
    height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 99px;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
  }
  .bar-fill.warn { background: #f5a623; }
  .bar-fill.over { background: var(--red); }

  /* ── Section titles ── */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 20px 10px;
  }
  .section-title { font-size: 11px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; font-family: var(--mono); }
  .add-btn {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent); color: var(--bg);
    border: none; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-weight: 600;
  }
  .add-btn:active { transform: scale(0.92); }

  /* ── Transaction list ── */
  .tx-list { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }

  .tx-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex; align-items: center; gap: 12px;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tx-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-cat { font-size: 11px; color: var(--text-faint); margin-top: 2px; font-family: var(--mono); }
  .tx-amount { font-family: var(--mono); font-size: 15px; font-weight: 500; flex-shrink: 0; }
  .tx-amount.expense { color: var(--text); }
  .tx-amount.income  { color: var(--accent); }
  .tx-delete {
    width: 28px; height: 28px; border-radius: 8px;
    background: transparent; border: none;
    color: var(--text-faint); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .tx-delete:active { color: var(--red); }

  /* ── Empty state ── */
  .empty {
    text-align: center; padding: 32px 20px;
    color: var(--text-faint); font-size: 13px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }

  /* ── Bottom padding for nav ── */
  .spacer { height: 100px; }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(15,15,18,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex; padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
    gap: 4px;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 8px 4px; border-radius: 10px;
    cursor: pointer; border: none; background: transparent; color: var(--text-faint);
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.02em;
    transition: color 0.2s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 20px; height: 20px; }

  /* ── Modal overlay ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
    width: 100%; max-width: 430px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px; border-radius: 99px;
    background: var(--border); margin: 0 auto 20px;
  }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }

  /* type toggle */
  .type-toggle {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface2); border-radius: 12px; padding: 4px;
    margin-bottom: 16px;
  }
  .toggle-btn {
    padding: 10px; border-radius: 9px; border: none;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; background: transparent; color: var(--text-mid);
    transition: all 0.2s;
  }
  .toggle-btn.active.expense { background: var(--red); color: white; }
  .toggle-btn.active.income  { background: var(--accent); color: var(--bg); }

  /* inputs */
  .field { margin-bottom: 12px; }
  .field label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--mono); display: block; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; color: var(--text);
    font-family: var(--sans); font-size: 16px;
    outline: none; -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--text-faint); }
  .field select option { background: var(--surface2); }

  .amount-field input {
    font-family: var(--mono); font-size: 28px; font-weight: 500;
    text-align: center; padding: 18px;
  }

  .submit-btn {
    width: 100%; padding: 16px; border-radius: 14px;
    background: var(--accent); color: var(--bg);
    border: none; font-family: var(--sans); font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  .submit-btn:active { opacity: 0.85; transform: scale(0.98); }

  /* ── Budget setup panel ── */
  .budget-panel { padding: 0 20px; }
  .budget-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .budget-item .b-icon { font-size: 22px; width: 36px; text-align: center; flex-shrink: 0; }
  .budget-item .b-info { flex: 1; }
  .budget-item .b-name { font-size: 14px; font-weight: 500; }
  .budget-item .b-sub { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 2px; }
  .budget-item .b-input {
    width: 80px; text-align: right;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; color: var(--accent);
    font-family: var(--mono); font-size: 14px; font-weight: 500;
    outline: none;
  }
  .budget-item .b-input:focus { border-color: var(--accent); }

  /* month modal */
  .month-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .month-opt {
    padding: 12px; border-radius: 10px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 12px; text-align: center;
    cursor: pointer;
  }
  .month-opt.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
  .month-opt:active { opacity: 0.75; }

  /* ── Subtle scrollbar ── */
  ::-webkit-scrollbar { width: 0; }

  /* ── Stats page ── */
  .stats-grid { padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
  }
  .stat-card .sc-label { font-size: 10px; color: var(--text-faint); font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .stat-card .sc-val { font-family: var(--mono); font-size: 20px; font-weight: 500; margin-top: 6px; }

  .top-cats { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .cat-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  .cat-row .cr-icon { font-size: 18px; flex-shrink: 0; }
  .cat-row .cr-info { flex: 1; }
  .cat-row .cr-name { font-size: 13px; font-weight: 500; }
  .cat-row .cr-bar-wrap { height: 4px; background: var(--surface2); border-radius: 99px; margin-top: 5px; overflow: hidden; }
  .cat-row .cr-bar { height: 100%; border-radius: 99px; background: var(--accent); }
  .cat-row .cr-amt { font-family: var(--mono); font-size: 13px; color: var(--text-mid); flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <span class="logo">BUDGET</span>
    <button class="month-btn" onclick="openMonthPicker()">
      <span id="month-display">May 2026</span>
      <span style="color:var(--accent)">▾</span>
    </button>
  </header>

  <!-- PAGES -->
  <div id="page-home">
    <!-- Hero balance -->
    <div class="hero">
      <div class="hero-label">Left to spend</div>
      <div class="hero-amount positive" id="hero-balance">£0</div>
      <div class="hero-stats">
        <div class="stat">
          <div class="stat-label">In</div>
          <div class="stat-value in" id="stat-in">£0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Out</div>
          <div class="stat-value out" id="stat-out">£0</div>
        </div>
      </div>
    </div>

    <!-- Budget bar -->
    <div class="budget-bar">
      <div class="bar-header">
        <span class="bar-title">Monthly budget used</span>
        <span class="bar-pct" id="budget-pct">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="bar-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Transactions -->
    <div class="section-header">
      <span class="section-title">This month</span>
      <button class="add-btn" onclick="openAddModal()">+</button>
    </div>
    <div class="tx-list" id="tx-list">
      <div class="empty"><div class="empty-icon">✦</div>No entries yet.<br>Tap + to add one.</div>
    </div>
    <div class="spacer"></div>
  </div>

  <div id="page-stats" style="display:none">
    <div class="section-header" style="padding-top:28px">
      <span class="section-title">This month</span>
    </div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-header" style="padding-top:20px">
      <span class="section-title">Top spending</span>
    </div>
    <div class="top-cats" id="top-cats"></div>
    <div class="spacer"></div>
  </div>

  <div id="page-budget" style="display:none">
    <div class="section-header" style="padding-top:28px">
      <span class="section-title">Monthly limits</span>
    </div>
    <div class="budget-panel" id="budget-panel"></div>
    <div class="spacer"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home" onclick="switchPage('home', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/>
      </svg>
      Home
    </button>
    <button class="nav-item" data-page="stats" onclick="switchPage('stats', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10M12 20V4M6 20v-6"/>
      </svg>
      Stats
    </button>
    <button class="nav-item" data-page="budget" onclick="switchPage('budget', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      </svg>
      Budget
    </button>
  </nav>
</div>

<!-- ADD TRANSACTION MODAL -->
<div class="overlay" id="add-modal" onclick="closeIfBg(event,'add-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Add entry</div>
    <div class="type-toggle">
      <button class="toggle-btn active expense" id="type-expense" onclick="setType('expense')">Expense</button>
      <button class="toggle-btn income" id="type-income" onclick="setType('income')">Income</button>
    </div>
    <div class="field amount-field">
      <label>Amount</label>
      <input type="number" inputmode="decimal" id="inp-amount" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="field">
      <label>Description</label>
      <input type="text" id="inp-desc" placeholder="e.g. Tesco, Salary…" maxlength="40">
    </div>
    <div class="field" id="cat-field">
      <label>Category</label>
      <select id="inp-cat">
        <option value="🛒 Groceries">🛒 Groceries</option>
        <option value="🏠 Housing">🏠 Housing</option>
        <option value="🚗 Transport">🚗 Transport</option>
        <option value="🍽️ Dining Out">🍽️ Dining Out</option>
        <option value="⚡ Utilities">⚡ Utilities</option>
        <option value="📱 Subscriptions">📱 Subscriptions</option>
        <option value="🏥 Health">🏥 Health</option>
        <option value="🎉 Entertainment">🎉 Entertainment</option>
        <option value="👗 Clothing">👗 Clothing</option>
        <option value="🎁 Gifts">🎁 Gifts</option>
        <option value="💰 Savings">💰 Savings</option>
        <option value="🔄 Other">🔄 Other</option>
      </select>
    </div>
    <button class="submit-btn" onclick="addTransaction()">Add</button>
  </div>
</div>

<!-- MONTH PICKER MODAL -->
<div class="overlay" id="month-modal" onclick="closeIfBg(event,'month-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Select month</div>
    <div class="month-grid" id="month-grid"></div>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const now = new Date();

const defaultBudgets = {
  '🛒 Groceries': 400, '🏠 Housing': 1200, '🚗 Transport': 200,
  '🍽️ Dining Out': 150, '⚡ Utilities': 120, '📱 Subscriptions': 50,
  '🏥 Health': 80, '🎉 Entertainment': 100, '👗 Clothing': 80,
  '🎁 Gifts': 50, '💰 Savings': 300, '🔄 Other': 100,
};

function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let currentMonth = load('currentMonth', now.getMonth());
let currentYear  = load('currentYear',  now.getFullYear());
let txData       = load('txData', {});      // keyed by "YYYY-MM"
let budgets      = load('budgets', defaultBudgets);
let txType       = 'expense';

function monthKey() { return `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`; }
function getTx()    { return txData[monthKey()] || []; }

// ── Rendering ───────────────────────────────────────────────────────────────
function render() {
  const tx   = getTx();
  const income  = tx.filter(t => t.type === 'income').reduce((a,t) => a + t.amount, 0);
  const expense = tx.filter(t => t.type === 'expense').reduce((a,t) => a + t.amount, 0);
  const balance = income - expense;
  const totalBudget = Object.values(budgets).reduce((a,v)=>a+v,0);
  const pct = totalBudget ? Math.min(expense / totalBudget * 100, 100) : 0;

  // Hero
  document.getElementById('hero-balance').textContent = fmt(balance);
  document.getElementById('hero-balance').className = 'hero-amount ' + (balance >= 0 ? 'positive' : 'negative');
  document.getElementById('stat-in').textContent  = fmt(income);
  document.getElementById('stat-out').textContent = fmt(expense);

  // Bar
  const bar = document.getElementById('bar-fill');
  bar.style.width = pct + '%';
  bar.className = 'bar-fill' + (pct >= 100 ? ' over' : pct >= 80 ? ' warn' : '');
  document.getElementById('budget-pct').textContent = Math.round(pct) + '%';

  // Month display
  document.getElementById('month-display').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

  renderTxList(tx);
  if (document.getElementById('page-stats').style.display !== 'none') renderStats(tx, income, expense);
}

function fmt(n) {
  const abs = Math.abs(n);
  const str = abs.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-£' : '£') + str;
}

function renderTxList(tx) {
  const el = document.getElementById('tx-list');
  if (!tx.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✦</div>No entries yet.<br>Tap + to add one.</div>';
    return;
  }
  const sorted = [...tx].sort((a,b) => b.id - a.id);
  el.innerHTML = sorted.map(t => `
    <div class="tx-item">
      <div class="tx-icon">${t.type === 'income' ? '💵' : catIcon(t.cat)}</div>
      <div class="tx-info">
        <div class="tx-name">${esc(t.desc)}</div>
        <div class="tx-cat">${t.type === 'income' ? 'Income' : t.cat}</div>
      </div>
      <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</div>
      <button class="tx-delete" onclick="deleteTx(${t.id})" aria-label="Delete">×</button>
    </div>
  `).join('');
}

function catIcon(cat) {
  return cat ? cat.split(' ')[0] : '💸';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderStats(tx, income, expense) {
  const grid = document.getElementById('stats-grid');
  const count = tx.length;
  const avgExp = tx.filter(t=>t.type==='expense').length
    ? expense / tx.filter(t=>t.type==='expense').length : 0;

  grid.innerHTML = `
    <div class="stat-card"><div class="sc-label">Income</div><div class="sc-val" style="color:var(--accent)">${fmt(income)}</div></div>
    <div class="stat-card"><div class="sc-label">Expenses</div><div class="sc-val" style="color:var(--red)">${fmt(expense)}</div></div>
    <div class="stat-card"><div class="sc-label">Saved</div><div class="sc-val">${fmt(income-expense)}</div></div>
    <div class="stat-card"><div class="sc-label">Avg spend</div><div class="sc-val">${fmt(avgExp)}</div></div>
  `;

  // Top categories
  const catTotals = {};
  tx.filter(t=>t.type==='expense').forEach(t => {
    catTotals[t.cat] = (catTotals[t.cat] || 0) + t.amount;
  });
  const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max = sorted[0]?.[1] || 1;

  document.getElementById('top-cats').innerHTML = sorted.length
    ? sorted.map(([cat, amt]) => `
      <div class="cat-row">
        <div class="cr-icon">${catIcon(cat)}</div>
        <div class="cr-info">
          <div class="cr-name">${cat}</div>
          <div class="cr-bar-wrap"><div class="cr-bar" style="width:${Math.round(amt/max*100)}%"></div></div>
        </div>
        <div class="cr-amt">${fmt(amt)}</div>
      </div>
    `).join('')
    : '<div class="empty"><div class="empty-icon">📊</div>No expense data yet.</div>';
}

function renderBudgetPanel() {
  const panel = document.getElementById('budget-panel');
  panel.innerHTML = Object.entries(budgets).map(([cat, val]) => `
    <div class="budget-item">
      <div class="b-icon">${catIcon(cat)}</div>
      <div class="b-info">
        <div class="b-name">${cat.replace(/^\S+\s/,'')}</div>
        <div class="b-sub">monthly limit</div>
      </div>
      <input class="b-input" type="number" inputmode="decimal" value="${val}"
        onchange="updateBudget('${cat}', this.value)" min="0" step="10">
    </div>
  `).join('');
}

// ── Actions ─────────────────────────────────────────────────────────────────
function addTransaction() {
  const amount = parseFloat(document.getElementById('inp-amount').value);
  const desc   = document.getElementById('inp-desc').value.trim();
  const cat    = document.getElementById('inp-cat').value;

  if (!amount || amount <= 0 || !desc) {
    document.getElementById('inp-amount').focus();
    return;
  }

  const key = monthKey();
  if (!txData[key]) txData[key] = [];
  txData[key].push({ id: Date.now(), type: txType, amount, desc, cat });
  save('txData', txData);

  document.getElementById('add-modal').classList.remove('open');
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-desc').value = '';
  render();
}

function deleteTx(id) {
  const key = monthKey();
  txData[key] = (txData[key] || []).filter(t => t.id !== id);
  save('txData', txData);
  render();
}

function updateBudget(cat, val) {
  budgets[cat] = parseFloat(val) || 0;
  save('budgets', budgets);
  render();
}

function setType(type) {
  txType = type;
  document.getElementById('type-expense').className = 'toggle-btn' + (type==='expense' ? ' active expense' : '');
  document.getElementById('type-income').className  = 'toggle-btn' + (type==='income'  ? ' active income'  : '');
  document.getElementById('cat-field').style.display = type === 'expense' ? '' : 'none';
}

// ── Navigation ───────────────────────────────────────────────────────────────
function switchPage(page, btn) {
  ['home','stats','budget'].forEach(p => {
    document.getElementById('page-'+p).style.display = p === page ? '' : 'none';
  });
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (page === 'stats')  { const tx=getTx(); renderStats(tx, tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0), tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0)); }
  if (page === 'budget') renderBudgetPanel();
  window.scrollTo(0,0);
}

// ── Modals ───────────────────────────────────────────────────────────────────
function openAddModal() {
  setType('expense');
  document.getElementById('add-modal').classList.add('open');
  setTimeout(() => document.getElementById('inp-amount').focus(), 350);
}

function openMonthPicker() {
  const grid = document.getElementById('month-grid');
  const year = currentYear;
  grid.innerHTML = MONTHS.map((m,i) => `
    <div class="month-opt ${i===currentMonth && year===currentYear ? 'selected' : ''}"
      onclick="selectMonth(${i})">
      ${m} ${year}
    </div>
  `).join('');
  document.getElementById('month-modal').classList.add('open');
}

function selectMonth(m) {
  currentMonth = m;
  save('currentMonth', currentMonth);
  document.getElementById('month-modal').classList.remove('open');
  render();
}

function closeIfBg(e, id) {
  if (e.target === document.getElementById(id)) {
    document.getElementById(id).classList.remove('open');
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
